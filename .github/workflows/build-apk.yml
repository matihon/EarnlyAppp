name: Build Earnly APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find HTML file
        run: |
          HTML_FILE=$(find . -maxdepth 1 -type f -name "*.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file found."
            exit 1
          fi

          echo "Found HTML file: $HTML_FILE"
          cp "$HTML_FILE" index.html

      - name: Check icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png not found."
            exit 1
          fi

          echo "icon.png found."

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "earnly",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest
          npm install @capacitor/cli@latest
          npm install @capacitor/android@latest
          npm install @capacitor/assets@latest

      - name: Create web directory
        run: |
          mkdir -p www

          cp index.html www/index.html

          if [ -f "icon.png" ]; then
            cp icon.png www/icon.png
          fi

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.earnly.app",
            "appName": "Earnly",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Create resources
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png

          if [ -f "splash.png" ]; then
            cp splash.png resources/splash.png
          else
            cp icon.png resources/splash.png
          fi

      - name: Add Android
        run: |
          npx cap add android

      - name: Generate Android icons and splash
        run: |
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Set app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")

          if p.exists():
              text = p.read_text()
              text = text.replace(
                  '<string name="app_name">Capacitor</string>',
                  '<string name="app_name">Earnly</string>'
              )
              p.write_text(text)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/Earnly.apk

      - name: Upload Earnly APK
        uses: actions/upload-artifact@v4
        with:
          name: Earnly-APK
          path: output/Earnly.apk
          if-no-files-found: error
