name: Build Earnly APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Earnly Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find HTML file
        shell: bash
        run: |
          set -e
          HTML_FILE="$(find . -maxdepth 1 -type f -iname '*.html' | head -n 1)"
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file found in repository root."
            exit 1
          fi
          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Using: $HTML_FILE"

      - name: Create web directory
        shell: bash
        run: |
          set -e
          rm -rf web
          mkdir -p web
          cp "$HTML_FILE" web/index.html

          if [ -f icon.png ]; then
            cp icon.png web/icon.png
          fi

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "earnly",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web app ready"
            },
            "dependencies": {
              "@capacitor/core": "7.4.4",
              "@capacitor/android": "7.4.4",
              "@capacitor/cli": "7.4.4"
            }
          }
          EOF

      - name: Install Capacitor
        run: npm install

      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          rm -rf android

          npx cap init Earnly com.earnly.app --web-dir web
          npx cap add android

          # Make sure the Android application name is Earnly.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/res/values/strings.xml")
          if p.exists():
              s = p.read_text()
              s = s.replace("app_name\">App</string>", "app_name\">Earnly</string>")
              p.write_text(s)
          PY

      - name: Prepare icon and splash assets
        shell: bash
        run: |
          set -e

          if [ -f icon.png ]; then
            mkdir -p resources
            cp icon.png resources/icon.png
            cp icon.png resources/splash.png

            # Generate Android launcher icons and splash resources.
            npm install --no-save @capacitor/assets@3.0.5
            npx capacitor-assets generate \
              --android \
              --iconBackgroundColor '#06101C' \
              --splashBackgroundColor '#06101C'
          else
            echo "icon.png not found; using Capacitor default resources."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android app name
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("android/app/src/main/res/values/strings.xml")
          if strings.exists():
              s = strings.read_text()
              import re
              s = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">Earnly</string>',
                  s
              )
              strings.write_text(s)

          gradle = Path("android/gradle.properties")
          with gradle.open("a") as f:
              f.write("\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n")
              f.write("android.useAndroidX=true\n")
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Earnly.apk

      - name: Upload Earnly APK
        uses: actions/upload-artifact@v4
        with:
          name: Earnly-APK
          path: output/Earnly.apk
          if-no-files-found: error
